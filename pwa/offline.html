<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3868BE">
  <title>오프라인 | 오피스지니</title>
  <style>
    :root { --page: #F5F7FA; --card: #FFFFFF; --title: #202D40; --muted: #67758A; --line: #E2E7EE; --blue: #3868BE; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh; display: grid; place-items: center; padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      background: var(--page); color: var(--title);
      font-family: Inter, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; word-break: keep-all;
    }
    main {
      width: min(420px, 100%); padding: 32px 28px; text-align: center;
      background: var(--card); border: 1px solid var(--line); border-radius: 20px;
      box-shadow: 0 12px 32px rgba(32, 45, 64, 0.06);
    }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 20px; display: grid; place-items: center;
      border-radius: 16px; background: var(--blue); color: #fff; font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
    }
    h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: -0.5px; }
    p { margin: 0 0 24px; color: var(--muted); font-size: 15px; line-height: 1.6; }
    button {
      width: 100%; min-height: 52px; border: 0; border-radius: 11px; background: var(--blue); color: #fff;
      font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #315EA9; }
    button:focus-visible { outline: 3px solid #BFCEEB; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">OG</div>
    <h1>인터넷에 연결되어 있지 않습니다</h1>
    <p>오피스지니는 사내 정보를 실시간으로 불러와서 연결이 필요합니다.<br>네트워크를 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
  <script>
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
