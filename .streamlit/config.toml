# 로컬 실행과 EC2(Docker) 배포가 같이 쓰는 설정. 운영 전용 값(오류 상세 숨김 등)은 docker-compose.yml 환경변수로 준다.

[server]
# 배포 환경에는 브라우저가 없다. 시작 명령의 --server.headless true와 같은 값.
headless = true
# 폼·업로드 요청 위조 방지. Caddy HTTPS 프록시 뒤에서도 켜 둔다(끄지 말 것).
enableXsrfProtection = true
enableCORS = true
corsAllowedOrigins = ["https://rqpx2mebtu58nwid.jitda.io"]
# 관리자 업로드(회사 JSON, 자료실 파일 최대 5MB)에 맞춘 상한(MB). 기본 200MB보다 작게.
maxUploadSize = 10

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#3868BE"
