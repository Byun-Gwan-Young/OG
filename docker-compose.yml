# 오피스지니 EC2 배포: 웹 + 원격 MCP 서버 + Caddy(HTTPS). DB는 Neon PostgreSQL(DATABASE_URL).
# 실행: deploy/deploy.sh (내부적으로 docker compose --env-file .env.production ...)
# 외부에는 caddy의 80/443만 연다. web·mcp는 expose만 하고 ports를 두지 않는다.
name: officegenie

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build: .
  image: officegenie-app:latest
  env_file: .env.production
  restart: unless-stopped
  logging: *logging

services:
  web:
    <<: *app
    command:
      - sh
      - -c
      - python scripts/preflight.py && exec streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    expose:
      - "8501"
    environment:
      # 운영 화면에서는 오류 상세와 개발자 메뉴를 숨기고, 코드 감시를 끈다.
      STREAMLIT_CLIENT_SHOW_ERROR_DETAILS: none
      STREAMLIT_CLIENT_TOOLBAR_MODE: viewer
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mcp:
    <<: *app
    command: ["python", "remote_server.py"]
    expose:
      - "8000"
    environment:
      PORT: "8000"
      OFFICEGENIE_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - web
      - mcp
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3(UDP 443)는 쓰지 않는다(Caddyfile에서 끔). 보안 그룹도 TCP 80/443만 연다.
    environment:
      # Caddy에는 도메인·메일만 넘긴다(DB 주소·API 키는 넘기지 않는다).
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN을 .env.production에 넣으세요}
      MCP_DOMAIN: ${MCP_DOMAIN:?MCP_DOMAIN을 .env.production에 넣으세요}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL을 .env.production에 넣으세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Caddy 관리 API(컨테이너 안 localhost:2019)가 응답하면 정상.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  # 인증서·ACME 계정. 컨테이너를 다시 만들어도 유지된다(삭제하면 인증서를 다시 받음).
  caddy_data:
  caddy_config:
