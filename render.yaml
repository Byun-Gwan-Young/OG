# Render Blueprint: 오피스지니 웹(Streamlit) + 원격 MCP 서버. 두 서비스가 같은 Neon PostgreSQL을 쓴다.
# 배포 방법: docs/guide-admin.md "Render 배포하기"
# sync: false 값은 Blueprint를 처음 만들 때 Render 화면에서 입력한다(저장소에 비밀 값을 두지 않는다).
services:
  - type: web
    name: officegenie-web
    runtime: python
    region: singapore
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python scripts/pwa_setup.py
    # preflight: 운영 모드인데 DATABASE_URL이 없으면 여기서 멈춘다(SQLite로 넘어가지 않음). PWA 미적용은 경고만.
    startCommand: python scripts/preflight.py && streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.15.2
      - key: OFFICEGENIE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: OFFICEGENIE_SIGNUP_CODE
        sync: false
      - key: OFFICEGENIE_MCP_PUBLIC_URL
        sync: false
      # 운영 화면에서는 오류 상세와 개발자 메뉴를 숨긴다(로컬 개발은 그대로).
      - key: STREAMLIT_CLIENT_SHOW_ERROR_DETAILS
        value: none
      - key: STREAMLIT_CLIENT_TOOLBAR_MODE
        value: viewer
      # 배포본은 코드가 바뀌지 않으므로 파일 감시를 끈다(무료 플랜 메모리 절약).
      - key: STREAMLIT_SERVER_FILE_WATCHER_TYPE
        value: none

  - type: web
    name: officegenie-mcp
    runtime: python
    region: singapore
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python remote_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.15.2
      - key: OFFICEGENIE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: OFFICEGENIE_SIGNUP_CODE
        sync: false
      - key: OFFICEGENIE_MCP_PUBLIC_URL
        sync: false
